[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-wam"
version = "0.3.0"
description = "Executable effect interfaces for cross-view human demonstration transfer"
requires-python = ">=3.10"
dependencies = ["torch>=2.9,<2.10", "numpy>=1.26,<3"]

[project.optional-dependencies]
native = ["diffusers==0.36.0", "transformers==4.55.2", "torchvision==0.24.0", "einops", "easydict", "accelerate", "safetensors", "huggingface-hub", "Pillow", "imageio", "websockets", "msgpack", "opencv-python", "ftfy", "scipy"]

[project.scripts]
evo-wam = "evo_wam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
