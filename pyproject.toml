[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-wam"
version = "0.1.0"
description = "Executable effect interfaces for cross-view human demonstration transfer"
requires-python = ">=3.10"
dependencies = ["torch>=2.9,<2.10", "numpy>=1.26,<3"]

[project.scripts]
evo-wam = "evo_wam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
